name: Diagnose arXiv 406

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dry-run the collector against the live APIs
        run: python scripts/fetch_arxiv_isac.py -n 2 | head -80

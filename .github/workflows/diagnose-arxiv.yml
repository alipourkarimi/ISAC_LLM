name: Diagnose arXiv 406

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe arXiv with different header sets
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse

          params = urllib.parse.urlencode({
              "search_query": 'all:"integrated sensing and communication"',
              "start": 0, "max_results": 2,
          })
          hosts = [
              "https://export.arxiv.org/api/query",
              "https://arxiv.org/api/query",
          ]
          BROWSER_UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                        "(KHTML, like Gecko) Chrome/140.0 Safari/537.36")
          variants = {
              "1 bare urllib (no headers)": {},
              "2 UA only": {"User-Agent": "isac-ai-paper-collector/1.1"},
              "3 UA + Accept": {
                  "User-Agent": "isac-ai-paper-collector/1.1",
                  "Accept": "application/atom+xml,application/xml;q=0.9,*/*;q=0.8"},
              "4 UA + Accept + gzip": {
                  "User-Agent": "isac-ai-paper-collector/1.1",
                  "Accept": "application/atom+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Encoding": "gzip, deflate"},
              "5 browser UA + Accept + gzip": {
                  "User-Agent": BROWSER_UA,
                  "Accept": "application/atom+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Encoding": "gzip, deflate"},
              "6 browser UA only": {"User-Agent": BROWSER_UA},
              "7 UA + */* accept + gzip": {
                  "User-Agent": "isac-ai-paper-collector/1.1",
                  "Accept": "*/*",
                  "Accept-Encoding": "gzip, deflate"},
          }
          for host in hosts:
              print(f"\n=== {host} ===")
              for name, headers in variants.items():
                  req = urllib.request.Request(f"{host}?{params}", headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = r.read()
                          print(f"  {name}: OK {r.status} ({len(body)} bytes, "
                                f"ctype={r.headers.get('Content-Type')})")
                  except urllib.error.HTTPError as e:
                      print(f"  {name}: HTTP {e.code} "
                            f"(server={e.headers.get('Server')}, "
                            f"ctype={e.headers.get('Content-Type')})")
                  except Exception as e:
                      print(f"  {name}: {type(e).__name__}: {e}")
          PY

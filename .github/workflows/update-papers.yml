name: Refresh arXiv paper report

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch latest ISAC + AI papers from arXiv
        run: python scripts/fetch_arxiv_isac.py -n 10 -o latest-arxiv-report.md

      - name: Commit and push if the report changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest-arxiv-report.md
          if git diff --cached --quiet; then
            echo "No changes in the arXiv report this week."
          else
            git commit -m "Weekly refresh of latest-arxiv-report.md"
            git push
          fi

      # Without this the job can fail every week and nobody notices: the report
      # just silently stops updating. Open an issue, or comment on the open one.
      - name: Report failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Weekly arXiv refresh is failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;
            const body = `The scheduled refresh of \`latest-arxiv-report.md\` failed.\n\n` +
                         `Run: ${runUrl}\n\n` +
                         `The report is now stale until this is fixed. A common cause is ` +
                         `the paper APIs changing what they accept from automated clients ` +
                         `(e.g. arXiv returning HTTP 406 to CI runners).`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "automation-failure",
            });
            const open = existing.data.find((issue) => issue.title === title);
            // Commenting rather than returning early matters: a stale open issue
            // would otherwise swallow every later failure and disarm this alarm.
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Failed again on ${new Date().toISOString().slice(0, 10)}.\n\n` +
                      `Run: ${runUrl}`,
              });
              core.warning(`Refresh failed again; commented on #${open.number}.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["automation-failure"],
            });
